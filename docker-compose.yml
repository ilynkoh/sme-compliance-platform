version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sme_compliance_db
    environment:
      POSTGRES_USER: sme_user
      POSTGRES_PASSWORD: sme_password
      POSTGRES_DB: sme_compliance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sme_user -d sme_compliance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sme_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sme_compliance_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql://sme_user:sme_password@db:5432/sme_compliance
      - DEBUG=True
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sme_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sme_compliance_frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sme_network

volumes:
  postgres_data:

networks:
  sme_network:
    driver: bridge